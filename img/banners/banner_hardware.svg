<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171B"/>
      <stop offset="100%" stop-color="#1F242B"/>
    </linearGradient>
    <linearGradient id="accentFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8A23A"/>
      <stop offset="100%" stop-color="#C97F1E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262C34" stroke-width="1"/>
    </pattern>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="38%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" y="0" width="800" height="300" fill="url(#maskGrad)"/>
    </mask>
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14171B" stop-opacity="1"/>
      <stop offset="20%" stop-color="#14171B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#14171B" stop-opacity="0"/>
    </linearGradient>

    <!-- Hardware icon symbols -->
    <g id="chip">
      <rect x="-45" y="-45" width="90" height="90" rx="4" fill="#20252C" stroke="#57626D" stroke-width="2.5"/>
      <rect x="-24" y="-24" width="48" height="48" fill="none" stroke="#454E58" stroke-width="1.5"/>
      <line x1="-24" y1="-8" x2="24" y2="-8" stroke="#454E58" stroke-width="1.5"/>
      <line x1="-24" y1="8" x2="24" y2="8" stroke="#454E58" stroke-width="1.5"/>
      <line x1="-8" y1="-24" x2="-8" y2="24" stroke="#454E58" stroke-width="1.5"/>
      <line x1="8" y1="-24" x2="8" y2="24" stroke="#454E58" stroke-width="1.5"/>
      <g stroke="#E8A23A" stroke-width="3">
        <line x1="-58" y1="-30" x2="-45" y2="-30"/>
        <line x1="-58" y1="0" x2="-45" y2="0"/>
        <line x1="-58" y1="30" x2="-45" y2="30"/>
        <line x1="58" y1="-30" x2="45" y2="-30"/>
        <line x1="58" y1="0" x2="45" y2="0"/>
        <line x1="58" y1="30" x2="45" y2="30"/>
        <line x1="-30" y1="-58" x2="-30" y2="-45"/>
        <line x1="0" y1="-58" x2="0" y2="-45"/>
        <line x1="30" y1="-58" x2="30" y2="-45"/>
        <line x1="-30" y1="58" x2="-30" y2="45"/>
        <line x1="0" y1="58" x2="0" y2="45"/>
        <line x1="30" y1="58" x2="30" y2="45"/>
      </g>
    </g>

    <g id="ram">
      <rect x="-95" y="-24" width="190" height="48" rx="3" fill="#20252C" stroke="#57626D" stroke-width="2.5"/>
      <rect x="-82" y="-24" width="14" height="16" fill="#454E58"/>
      <rect x="-58" y="-24" width="14" height="16" fill="#454E58"/>
      <rect x="-34" y="-24" width="14" height="16" fill="#454E58"/>
      <rect x="-10" y="-24" width="14" height="16" fill="#454E58"/>
      <rect x="14" y="-24" width="14" height="16" fill="#454E58"/>
      <rect x="38" y="-24" width="14" height="16" fill="#454E58"/>
      <rect x="62" y="-24" width="14" height="16" fill="#454E58"/>
      <g stroke="#5B6772" stroke-width="2">
        <line x1="-88" y1="24" x2="-88" y2="32"/>
        <line x1="-72" y1="24" x2="-72" y2="32"/>
        <line x1="-56" y1="24" x2="-56" y2="32"/>
        <line x1="-40" y1="24" x2="-40" y2="32"/>
        <line x1="-24" y1="24" x2="-24" y2="32"/>
        <line x1="-8" y1="24" x2="-8" y2="32"/>
        <line x1="8" y1="24" x2="8" y2="32"/>
        <line x1="24" y1="24" x2="24" y2="32"/>
        <line x1="40" y1="24" x2="40" y2="32"/>
        <line x1="56" y1="24" x2="56" y2="32"/>
        <line x1="72" y1="24" x2="72" y2="32"/>
        <line x1="88" y1="24" x2="88" y2="32"/>
      </g>
    </g>

    <g id="fan">
      <circle r="52" fill="#20252C" stroke="#57626D" stroke-width="2.5"/>
      <g fill="#3A4552">
        <ellipse cx="0" cy="-28" rx="12" ry="24" transform="rotate(0)"/>
        <ellipse cx="0" cy="-28" rx="12" ry="24" transform="rotate(60)"/>
        <ellipse cx="0" cy="-28" rx="12" ry="24" transform="rotate(120)"/>
        <ellipse cx="0" cy="-28" rx="12" ry="24" transform="rotate(180)"/>
        <ellipse cx="0" cy="-28" rx="12" ry="24" transform="rotate(240)"/>
        <ellipse cx="0" cy="-28" rx="12" ry="24" transform="rotate(300)"/>
      </g>
      <circle r="14" fill="#20252C" stroke="#E8A23A" stroke-width="2.5"/>
      <circle r="46" fill="none" stroke="#454E58" stroke-width="1.5"/>
    </g>

    <g id="hdd">
      <rect x="-70" y="-48" width="140" height="96" rx="6" fill="#20252C" stroke="#57626D" stroke-width="2.5"/>
      <circle cx="10" cy="0" r="30" fill="none" stroke="#454E58" stroke-width="2"/>
      <circle cx="10" cy="0" r="7" fill="#454E58"/>
      <circle cx="-52" cy="-34" r="4" fill="#454E58"/>
      <circle cx="52" cy="-34" r="4" fill="#454E58"/>
      <circle cx="-52" cy="34" r="4" fill="#454E58"/>
      <circle cx="52" cy="34" r="4" fill="#454E58"/>
      <rect x="-58" y="30" width="30" height="8" rx="1" fill="#E8A23A" opacity="0.85"/>
    </g>

    <g id="wrench">
      <path d="M -60 40 L 10 -30" stroke="#57626D" stroke-width="14" stroke-linecap="round"/>
      <circle cx="-64" cy="44" r="20" fill="#20252C" stroke="#57626D" stroke-width="6"/>
      <path d="M 20 -40 a 24 24 0 1 1 -34 34 l 10 -10 a 10 10 0 0 0 14 -14 z" fill="#20252C" stroke="#57626D" stroke-width="5"/>
    </g>

    <g id="bolt">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#20252C" stroke="#5B6772" stroke-width="3"/>
      <circle r="10" fill="none" stroke="#5B6772" stroke-width="3"/>
    </g>
  </defs>

  <!-- Base -->
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#grid)" mask="url(#fadeMask)"/>

  <!-- Right side: pile of hardware, compressed further to fit narrow canvas -->
  <g>
    <use href="#ram" x="384" y="72" transform="rotate(-16 384 72) scale(0.5)"/>
    <use href="#fan" x="512" y="88" transform="rotate(0 512 88) scale(0.54)"/>
    <use href="#chip" x="608" y="150" transform="rotate(10 608 150) scale(0.54)"/>
    <use href="#hdd" x="704" y="205" transform="rotate(-8 704 205) scale(0.5)"/>
    <use href="#wrench" x="756" y="245" transform="rotate(12 756 245) scale(0.4)"/>
    <use href="#bolt" x="448" y="240" transform="rotate(15 448 240) scale(0.37)"/>
    <use href="#bolt" x="616" y="248" transform="rotate(-20 616 248) scale(0.32)"/>
  </g>

  <!-- fade so icons don't fight the text -->
  <rect x="304" y="0" width="128" height="300" fill="url(#edgeFade)"/>

  <!-- Vertical accent bar -->
  <rect x="38" y="55" width="5" height="190" fill="url(#accentFade)"/>

  <!-- Headline -->
  <text x="58" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="16" fill="#9AA4B1" letter-spacing="0.3">
    Toda a linha de hardware
  </text>

  <!-- Big number as hero -->
  <text x="54" y="176" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="86" fill="#F2F0EA">40%</text>
  <text x="216" y="176" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="36" fill="#E8A23A">off</text>

  <!-- Subtext -->
  <text x="59" y="206" font-family="Arial, Helvetica, sans-serif" font-weight="400"
        font-size="14" fill="#C7CCD3">
    em qualquer peça ou equipamento da loja
  </text>

  <!-- CTA -->
  <rect x="58" y="225" width="150" height="37" rx="4" fill="#E8A23A"/>
  <text x="133" y="248" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="15" fill="#14171B" text-anchor="middle">Confira agora</text>

</svg>
