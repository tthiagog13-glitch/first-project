<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fundo geral -->
  <rect x="0" y="0" width="640" height="200" fill="rgb(8,2,40)"/>

  <!-- Badge com o K -->
  <rect x="20" y="30" width="140" height="140" rx="28" fill="rgb(8,2,40)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <text x="90" y="140" font-family="Helvetica, Arial, sans-serif" font-size="110" font-weight="700"
        fill="#ffffff" text-anchor="middle">K</text>

  <!-- Nome completo -->
  <text x="190" y="118" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="500"
        fill="#ffffff" letter-spacing="1">kay<tspan fill="#ffffff" font-weight="700">'</tspan>oz</text>

  <!-- linha fina decorativa -->
  <rect x="192" y="132" width="220" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
</svg>
